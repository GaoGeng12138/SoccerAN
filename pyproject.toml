[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socceran"
version = "0.1.0"
description = "Poisson + Elo football prediction baseline for Big Five leagues"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GaoGeng12138" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Optional: soccerdata for alternate scrapers (not required for v1)
# soccerdata = ["soccerdata>=1.0"]

[project.scripts]
socceran = "socceran.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
